name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-zmk-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-zmk-

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr Export
        run: west zephyr-export

      - name: Build Sofle Left
        run: |
          west build -p always -s zmk/app -b nice_nano -- \
            -DSHIELD=sofle_left \
            -DZMK_CONFIG=${GITHUB_WORKSPACE}/config

      - name: Rename Sofle Left
        run: cp build/zephyr/zmk.uf2 sofle_left.uf2

      - name: Build Sofle Right
        run: |
          west build -p always -s zmk/app -b nice_nano -- \
            -DSHIELD=sofle_right \
            -DZMK_CONFIG=${GITHUB_WORKSPACE}/config

      - name: Rename Sofle Right
        run: cp build/zephyr/zmk.uf2 sofle_right.uf2

      - name: Upload Firmwares
        uses: actions/upload-artifact@v4
        with:
          name: sofle-firmware
          path: "*.uf2"
          if-no-files-found: error
