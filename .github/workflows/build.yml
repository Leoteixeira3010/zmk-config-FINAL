on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            .west/
          key: ${{ runner.os }}-build-zephyr-4.1.0-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-zephyr-4.1.0-
            ${{ runner.os }}-build-

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update --fetch-opt=--filter=tree:0

      - name: West Zephyr export
        run: west zephyr-export

      # ---------- LEFT ----------
      - name: West Build (Sofle Left)
        run: west build -s zmk/app -b nice_nano//zmk -- -DSHIELD=sofle_left -DZMK_CONFIG=$GITHUB_WORKSPACE/config

      - name: Sofle Left Kconfig file
        run: cat build/zephyr/.config | grep -v "^#" | grep -v "^$"

      - name: Rename left UF2
        run: cp build/zephyr/zmk.uf2 sofle_left_nice_nano.uf2

      - name: Archive (Sofle Left)
        uses: actions/upload-artifact@v4
        with:
          name: sofle_left_firmware
          path: sofle_left_nice_nano.uf2

      # ---------- RIGHT ----------
      - name: West Build (Sofle Right)
        run: west build --pristine -s zmk/app -b nice_nano//zmk -- -DSHIELD=sofle_right -DZMK_CONFIG=$GITHUB_WORKSPACE/config

      - name: Sofle Right Kconfig file
        run: cat build/zephyr/.config | grep -v "^#" | grep -v "^$"

      - name: Rename right UF2
        run: cp build/zephyr/zmk.uf2 sofle_right_nice_nano.uf2

      - name: Archive (Sofle Right)
        uses: actions/upload-artifact@v4
        with:
          name: sofle_right_firmware
          path: sofle_right_nice_nano.uf2
