# Display (OLED) – precisa de overlay I2C+display correto
CONFIG_ZMK_DISPLAY=y

# ZMK Studio (ative só se seu ZMK tiver o símbolo; se der erro, comente)
CONFIG_ZMK_STUDIO=y

# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Conectividade
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Energia
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth TX power (evite duplicar)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_WS2812_STRIP=y

# Debounce (opcional)
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
