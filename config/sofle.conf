# Ativar Display OLED (se possuir)
# CONFIG_ZMK_DISPLAY=y

# Suporte para Encoders Rotativos
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Gerenciamento de Energia
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Aumentar potência do Bluetooth para melhor conexão entre as metades
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
