# Ativar Display OLED e I2C
CONFIG_ZMK_DISPLAY=y

# Habilitar ZMK Studio
CONFIG_ZMK_STUDIO=y

# Suporte para Encoders Rotativos
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Configurações de Conectividade e USB
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
# Prioriza USB quando o cabo está conectado
CONFIG_ZMK_USB=y

# Gerenciamento de Energia
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Potência do Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_WS2812_STRIP=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
